        // --- 工具函數 ---
        const formatDate = (dateString) => {
            const date = new Date(dateString);
            return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
        };

        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };

        const getBillingCycle = (dateStr, closingDay = 20, cycleType = 'monthly') => {
            const parts = dateStr.split('-');
            let year = parseInt(parts[0], 10);
            let month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);

            if (day > closingDay) {
                month += 1;
                if (month > 12) { month = 1; year += 1; }
            }

            if (cycleType === 'bimonthly-even') {
                while (month % 2 !== 0) { month += 1; if (month > 12) { month = 1; year += 1; } }
            } else if (cycleType === 'bimonthly-odd') {
                while (month % 2 === 0) { month += 1; if (month > 12) { month = 1; year += 1; } }
            }
            
            return `${year}/${String(month).padStart(2, '0')}/${String(closingDay).padStart(2, '0')}`;
        };

        // --- SVG Pie Chart ---

            if (!data || data.length === 0) return (
                <div className="flex flex-col items-center justify-center py-10 opacity-50">
                    <div className="w-32 h-32 rounded-full border-4 border-slate-100 flex items-center justify-center mb-2">

                    </div>
                    <p className="text-slate-400 text-xs">{t ? t('noStatData') : '無數據'}</p>
                </div>
            );

            let cumulativePercent = 0;
            const getCoordinatesForPercent = (percent) => {
                const x = Math.cos(2 * Math.PI * percent);
                const y = Math.sin(2 * Math.PI * percent);
                return [x, y];
            };

            const slices = data.map(slice => {
                const [startX, startY] = getCoordinatesForPercent(cumulativePercent);
                cumulativePercent += slice.percent;
                const [endX, endY] = getCoordinatesForPercent(cumulativePercent);
                const largeArcFlag = slice.percent > 0.5 ? 1 : 0;
                const pathData = slice.percent >= 0.999 
                    ? `M 1 0 A 1 1 0 1 1 -1 0 A 1 1 0 1 1 1 0`
                    : `M 0 0 L ${startX} ${startY} A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY} L 0 0`;
                return { ...slice, pathData };
            });

            return (
                <div className="flex flex-col items-center">
                    <div className="relative w-48 h-48 mb-6">

                            isPaid: false
                        };
                        newTrans.unshift(newTransaction);

                        const currentDueDate = new Date(currentSub.nextDate);
                        let nextDueDate = new Date(currentDueDate);
                        if (currentSub.cycle === 'monthly') nextDueDate.setMonth(nextDueDate.getMonth() + 1);
                        else if (currentSub.cycle === 'weekly') nextDueDate.setDate(nextDueDate.getDate() + 7);
                        else if (currentSub.cycle === 'yearly') nextDueDate.setFullYear(nextDueDate.getFullYear() + 1);
                        
                        currentSub.nextDate = nextDueDate.toISOString().split('T')[0];
                        subsUpdated = true;
                    }
                    return currentSub;

                    setTransactions(newTrans);

                        if (isGenie) {

                            if (t.paymentMethod === '信用卡') {
                                if (!t.isPaid) totalUnpaidCredit += amt;
                                if (!creditBills[tCycleStr]) creditBills[tCycleStr] = { total: 0, unpaid: 0, items: [] };
                                creditBills[tCycleStr].items.push(t);
                                creditBills[tCycleStr].total += amt;

                            }

                                    </div>
                                    <div className="space-y-4 bg-slate-50 p-4 rounded-2xl">
                                        <div className="flex justify-between items-center border-b border-slate-100 pb-3"><span className="text-slate-400 text-xs font-bold uppercase tracking-wider">{t('dateField')}</span><span className="text-slate-700 font-bold text-sm">{selectedTransaction.date}</span></div>
                                        <div className="flex justify-between items-center border-b border-slate-100 pb-3"><span className="text-slate-400 text-xs font-bold uppercase tracking-wider">{t('payMethod')}</span><span className="text-slate-700 font-bold text-sm">{getPay(selectedTransaction.paymentMethod)}</span></div>
                                        {selectedTransaction.note && <div className="flex justify-between items-start pt-1"><span className="text-slate-400 text-xs font-bold uppercase tracking-wider mt-0.5">{t('nameField')}</span><span className="text-slate-700 font-bold text-sm max-w-[200px] text-right break-words">{selectedTransaction.note}</span></div>}
                                    </div>
                                    <div className="mt-8 flex gap-3">
                                        <button onClick={() => { setSelectedTransaction(null); triggerDelete(selectedTransaction.id); }} className="flex-1 py-3.5 rounded-xl bg-rose-50 text-rose-500 font-bold text-sm hover:bg-rose-100 transition-colors flex items-center justify-center gap-2"><Trash2 size={18} /> {t('confirmDel')}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 匯出選項 Modal */}
                        {exportModal.isOpen && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in" onClick={() => setExportModal({...exportModal, isOpen: false})}>
                                <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                                    <h3 className="text-xl font-black text-slate-800 mb-2 flex items-center gap-2"><Download size={20} className="text-blue-600"/> {t('exportOptions')}</h3>
                                    <p className="text-xs text-slate-500 mb-6">請選擇帳單明細中要顯示的文字內容：</p>
                                    
                                    <div className="space-y-3 mb-8">
                                        <label className={`flex items-center justify-between p-4 border-2 rounded-2xl cursor-pointer transition-all active:scale-[0.98] ${exportMode === 'name' ? 'border-blue-500 bg-blue-50' : 'border-slate-100 hover:bg-slate-50'}`}>
                                            <div>
                                                <span className={`block font-bold ${exportMode === 'name' ? 'text-blue-700' : 'text-slate-700'}`}>{t('showName')}</span>
                                                <span className="text-[10px] text-slate-400">例如：樓下買便當、大潤發</span>
                                            </div>
                                            <input type="radio" name="exportMode" value="name" checked={exportMode === 'name'} onChange={() => setExportMode('name')} className="w-5 h-5 text-blue-600 focus:ring-blue-500 accent-blue-600" />
                                        </label>
                                        <label className={`flex items-center justify-between p-4 border-2 rounded-2xl cursor-pointer transition-all active:scale-[0.98] ${exportMode === 'category' ? 'border-blue-500 bg-blue-50' : 'border-slate-100 hover:bg-slate-50'}`}>
                                            <div>
                                                <span className={`block font-bold ${exportMode === 'category' ? 'text-blue-700' : 'text-slate-700'}`}>{t('showCategory')}</span>
                                                <span className="text-[10px] text-slate-400">例如：餐飲、購物、交通</span>
                                            </div>
                                            <input type="radio" name="exportMode" value="category" checked={exportMode === 'category'} onChange={() => setExportMode('category')} className="w-5 h-5 text-blue-600 focus:ring-blue-500 accent-blue-600" />
                                        </label>
                                    </div>

                                    <div className="flex gap-3">
                                        <button onClick={() => setExportModal({...exportModal, isOpen: false})} className="flex-1 py-3 text-slate-500 font-bold hover:bg-slate-50 rounded-xl transition-colors">{t('cancel')}</button>
                                        <button onClick={executeExport} className="flex-1 py-3 text-white font-bold bg-blue-600 shadow-lg shadow-blue-200 hover:bg-blue-700 rounded-xl transition-colors active:scale-95">{t('confirmExport')}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <ConfirmModal isOpen={confirmState.isOpen} title={confirmState.title} message={confirmState.message} confirmText={confirmState.confirmText} confirmColor={confirmState.confirmColor} onConfirm={handleConfirmAction} onCancel={() => setConfirmState({ ...confirmState, isOpen: false, type: null, data: null })} t={t}/>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
