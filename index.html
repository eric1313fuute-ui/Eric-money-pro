<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>效率記帳本 - 行動版</title>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icon Components ---
        const Icon = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Plus = (props) => <Icon {...props}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
        const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
        const CreditCard = (props) => <Icon {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></Icon>;
        const Wallet = (props) => <Icon {...props}><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></Icon>;
        const PieChart = (props) => <Icon {...props}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></Icon>;
        const Home = (props) => <Icon {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
        const Landmark = (props) => <Icon {...props}><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></Icon>;
        const Sparkles = (props) => <Icon {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 5h4"/><path d="M3 9h4"/></Icon>;
        const User = (props) => <Icon {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
        const Settings = (props) => <Icon {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"/></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"/></Icon>;
        const Filter = (props) => <Icon {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
        const X = (props) => <Icon {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
        const CheckCircle = (props) => <Icon {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
        const AlertCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
        const RefreshCcw = (props) => <Icon {...props}><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/></Icon>;
        const Download = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const CalendarClock = (props) => <Icon {...props}><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M3 14h3"/><path d="M12 12v6h-2"/><circle cx="16" cy="18" r="5"/><polyline points="16 16 16 18 18 18"/></Icon>;
        const Repeat = (props) => <Icon {...props}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></Icon>;
        const PlayCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></Icon>;

        // --- 工具函數 ---
        const formatDate = (dateString) => {
            const date = new Date(dateString);
            return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
        };

        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };

        const getBillingCycle = (dateStr, closingDay = 20, cycleType = 'monthly') => {
            const parts = dateStr.split('-');
            let year = parseInt(parts[0], 10);
            let month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);

            if (day > closingDay) {
                month += 1;
                if (month > 12) { month = 1; year += 1; }
            }

            if (cycleType === 'bimonthly-even') {
                while (month % 2 !== 0) { month += 1; if (month > 12) { month = 1; year += 1; } }
            } else if (cycleType === 'bimonthly-odd') {
                while (month % 2 === 0) { month += 1; if (month > 12) { month = 1; year += 1; } }
            }
            
            return `${year}/${String(month).padStart(2, '0')}/${String(closingDay).padStart(2, '0')}`;
        };

        // --- 自定義確認對話框 ---
        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "確認", confirmColor = "bg-red-500" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-500 text-sm mb-6">{message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-2 text-slate-500 font-bold hover:bg-slate-50 rounded-lg transition-colors">取消</button>
                            <button onClick={onConfirm} className={`flex-1 py-2 text-white font-bold rounded-lg transition-colors ${confirmColor} hover:opacity-90`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 交易詳情彈窗元件 ---
        const TransactionDetailModal = ({ transaction, onClose, onDelete }) => {
            if (!transaction) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
                        <button onClick={onClose} className="absolute right-4 top-4 p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 transition-colors hidden sm:block">
                            <X size={20} />
                        </button>
                        
                        <div className="text-center mb-8">
                            <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 shadow-sm ${transaction.payer === 'genie' ? 'bg-purple-100 text-purple-600' : transaction.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                                {transaction.payer === 'genie' ? <Sparkles size={40} /> : (transaction.type === 'income' ? <Landmark size={40} /> : <CreditCard size={40} />)}
                            </div>
                            <h3 className="text-xl font-bold text-slate-800">{transaction.category}</h3>
                            <p className={`text-4xl font-black mt-2 ${transaction.payer === 'genie' ? 'text-purple-600' : transaction.type === 'income' ? 'text-emerald-600' : 'text-slate-900'}`}>
                                {transaction.type === 'income' ? '+' : ''} {transaction.amount.toLocaleString()}
                            </p>
                            {transaction.payer === 'genie' && <span className="inline-block mt-2 text-xs font-bold bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full">✨ 神燈代付</span>}
                        </div>

                        <div className="space-y-4 bg-slate-50 p-4 rounded-2xl">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">交易日期</span>
                                <span className="text-slate-700 font-bold text-sm">{transaction.date}</span>
                            </div>
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">付款方式</span>
                                <span className="text-slate-700 font-bold text-sm">{transaction.paymentMethod}</span>
                            </div>
                             <div className="flex justify-between items-center border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">付款人</span>
                                <span className="text-slate-700 font-bold text-sm flex items-center gap-1">
                                     {transaction.payer === 'genie' ? <><Sparkles size={14} className="text-purple-500"/> 神燈</> : <><User size={14} className="text-blue-500"/> 自己</>}
                                </span>
                            </div>
                            {transaction.note && (
                                <div className="flex justify-between items-start border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                    <span className="text-slate-400 text-xs font-bold uppercase tracking-wider mt-0.5">名稱</span>
                                    <span className="text-slate-700 font-bold text-sm max-w-[200px] text-right break-words">{transaction.note}</span>
                                </div>
                            )}
                        </div>

                        <div className="mt-8 flex gap-3">
                            <button onClick={() => { onClose(); onDelete(transaction.id); }} className="flex-1 py-3.5 rounded-xl bg-rose-50 text-rose-500 font-bold text-sm hover:bg-rose-100 transition-colors flex items-center justify-center gap-2">
                                <Trash2 size={18} /> 刪除紀錄
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SVG Pie Chart (Enhanced) ---
        const SimplePieChart = ({ data }) => {
            if (!data || data.length === 0) return (
                <div className="flex flex-col items-center justify-center py-10 opacity-50">
                    <div className="w-32 h-32 rounded-full border-4 border-slate-100 flex items-center justify-center mb-2">
                        <span className="text-2xl text-slate-300">0%</span>
                    </div>
                    <p className="text-slate-400 text-xs">此期間無支出數據</p>
                </div>
            );

            let cumulativePercent = 0;
            const getCoordinatesForPercent = (percent) => {
                const x = Math.cos(2 * Math.PI * percent);
                const y = Math.sin(2 * Math.PI * percent);
                return [x, y];
            };

            const slices = data.map(slice => {
                const [startX, startY] = getCoordinatesForPercent(cumulativePercent);
                cumulativePercent += slice.percent;
                const [endX, endY] = getCoordinatesForPercent(cumulativePercent);
                const largeArcFlag = slice.percent > 0.5 ? 1 : 0;
                const pathData = slice.percent >= 0.999 
                    ? `M 1 0 A 1 1 0 1 1 -1 0 A 1 1 0 1 1 1 0`
                    : `M 0 0 L ${startX} ${startY} A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY} L 0 0`;
                return { ...slice, pathData };
            });

            return (
                <div className="flex flex-col items-center">
                    <div className="relative w-48 h-48 mb-6">
                        <svg viewBox="-1 -1 2 2" className="transform -rotate-90 w-full h-full overflow-visible">
                            {slices.map((slice, index) => (
                                <path key={index} d={slice.pathData} fill={slice.color} stroke="white" strokeWidth="0.02" />
                            ))}
                        </svg>
                        <div className="absolute inset-0 m-auto w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-inner">
                            <span className="text-xs font-bold text-slate-400">支出分佈</span>
                        </div>
                    </div>
                    {/* Updated Legend with Amount */}
                    <div className="w-full grid grid-cols-1 gap-2">
                        {data.map((slice, index) => (
                            <div key={index} className="flex items-center justify-between text-xs p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full shadow-sm" style={{ backgroundColor: slice.color }}></div>
                                    <span className="text-slate-700 font-bold text-sm">{slice.category}</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="text-slate-900 font-black text-sm">NT$ {slice.amount.toLocaleString()}</span>
                                    <span className="text-slate-400 font-medium bg-slate-50 px-2 py-0.5 rounded-md min-w-[3rem] text-center">{Math.round(slice.percent * 100)}%</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        function App() {
            const [activeTab, setActiveTab] = useState('home'); 
            const [transactions, setTransactions] = useState([]);
            const [subscriptions, setSubscriptions] = useState([]); // New state for subscriptions
            const [billingSettings, setBillingSettings] = useState({ closingDay: 20, cycleType: 'monthly' });
            
            // 表單狀態
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense'); 
            const [category, setCategory] = useState('餐飲');
            const [paymentMethod, setPaymentMethod] = useState('現金');
            const [payer, setPayer] = useState('self'); 
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [note, setNote] = useState('');

            // 統計與篩選狀態
            const [statsCycle, setStatsCycle] = useState('all');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [searchMinAmount, setSearchMinAmount] = useState('');
            const [searchMaxAmount, setSearchMaxAmount] = useState('');
            const [searchCategory, setSearchCategory] = useState('');
            const [searchStartDate, setSearchStartDate] = useState('');
            const [searchEndDate, setSearchEndDate] = useState('');
            const [showFilters, setShowFilters] = useState(false);
            
            // 介面展開狀態
            const [expandedBill, setExpandedBill] = useState(null);

            // 狀態：被選中的交易（用於詳情彈窗）
            const [selectedTransaction, setSelectedTransaction] = useState(null);

            // 確認與備份狀態
            const [confirmState, setConfirmState] = useState({ 
                isOpen: false, 
                type: null, 
                data: null, 
                title: '', 
                message: '',
                confirmText: '確認',
                confirmColor: 'bg-red-500'
            });
            const fileInputRef = useRef(null);

            // Subscription form state
            const [subName, setSubName] = useState('');
            const [subAmount, setSubAmount] = useState('');
            const [subCycle, setSubCycle] = useState('monthly');
            const [subNextDate, setSubNextDate] = useState(new Date().toISOString().split('T')[0]);
            const [isAddingSub, setIsAddingSub] = useState(false);

            useEffect(() => {
                const savedData = localStorage.getItem('expense_tracker_data_v5');
                if (savedData) setTransactions(JSON.parse(savedData));
                const savedSettings = localStorage.getItem('expense_tracker_settings');
                if (savedSettings) setBillingSettings(JSON.parse(savedSettings));
                const savedSubs = localStorage.getItem('expense_tracker_subs_v1'); // Load subs
                if (savedSubs) setSubscriptions(JSON.parse(savedSubs));
            }, []);

            useEffect(() => {
                localStorage.setItem('expense_tracker_data_v5', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('expense_tracker_settings', JSON.stringify(billingSettings));
                setStatsCycle('all');
            }, [billingSettings]);

            useEffect(() => {
                localStorage.setItem('expense_tracker_subs_v1', JSON.stringify(subscriptions));
            }, [subscriptions]);

            const expenseCategories = ['餐飲', '交通', '購物', '娛樂', '居住', '醫療', '教育', '訂閱', '其他']; // Added '訂閱'
            const incomeCategories = ['薪資', '獎金', '投資', '兼職', '其他'];
            const paymentMethods = ['現金', '信用卡', '銀行轉帳', '電子支付'];
            const chartColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6366f1', '#64748b', '#0ea5e9'];

            const globalStats = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                const currentCycleStr = getBillingCycle(today, billingSettings.closingDay, billingSettings.cycleType);

                let totalIncome = 0;
                let totalExpense = 0;       
                let totalUnpaidCredit = 0;  
                let totalGenieExpense = 0;  
                let todayExpense = 0;
                let weekExpense = 0;
                let monthExpense = 0;

                const creditBills = {}; 
                const genieBills = {};  

                transactions.forEach(t => {
                    const tDate = new Date(t.date);
                    const amt = parseFloat(t.amount);
                    const isGenie = t.payer === 'genie';
                    
                    const tCycleStr = getBillingCycle(t.date, billingSettings.closingDay, billingSettings.cycleType);

                    if (t.type === 'income') {
                        totalIncome += amt;
                    } else {
                        if (isGenie) {
                            totalGenieExpense += amt;
                            if (!genieBills[tCycleStr]) genieBills[tCycleStr] = { total: 0, items: [] };
                            genieBills[tCycleStr].items.push(t);
                            genieBills[tCycleStr].total += amt;
                        } else {
                            totalExpense += amt;
                            if (t.date === today) todayExpense += amt;
                            if (t.date.startsWith(today.slice(0, 7))) monthExpense += amt;
                            if (getWeekNumber(tDate) === getWeekNumber(new Date()) && tDate.getFullYear() === new Date().getFullYear()) weekExpense += amt;

                            if (t.paymentMethod === '信用卡') {
                                if (!t.isPaid) totalUnpaidCredit += amt;
                                if (!creditBills[tCycleStr]) creditBills[tCycleStr] = { total: 0, unpaid: 0, items: [] };
                                creditBills[tCycleStr].items.push(t);
                                creditBills[tCycleStr].total += amt;
                                if (!t.isPaid) creditBills[tCycleStr].unpaid += amt;
                            }
                        }
                    }
                });

                const sortedBillDates = Object.keys(creditBills).sort((a, b) => new Date(b) - new Date(a));
                const sortedGenieDates = Object.keys(genieBills).sort((a, b) => new Date(b) - new Date(a));

                return {
                    balance: totalIncome - totalExpense,
                    totalIncome, totalExpense, totalGenieExpense, totalUnpaidCredit,
                    todayExpense, weekExpense, monthExpense,
                    creditBills, sortedBillDates, genieBills, sortedGenieDates
                };
            }, [transactions, billingSettings]);

            const filteredTransactionsForStats = useMemo(() => {

                                <div className="mt-4 pt-4 border-t border-slate-700 flex justify-end">
                                    {currentSelfBill.total > 0 ? (
                                        <button onClick={() => toggleBillPayment(currentCycleStr, !isCurrentBillPaid)} className={`flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-xs transition-all ${isCurrentBillPaid ? 'bg-emerald-600 text-white' : 'bg-white text-slate-900'}`}>
                                            {isCurrentBillPaid ? <CheckCircle size={16} /> : <div className="w-4 h-4 rounded-full border-2 border-slate-900"></div>}
                                            {isCurrentBillPaid ? '已繳清' : '標記為已繳'}
                                        </button>
                                    ) : <span className="text-xs text-slate-500 italic">本期無自付消費</span>}
                                </div>
                            </div>
                        </div>

                        {pastDueTotal > 0 && (
                            <div className="bg-red-50 border border-red-200 p-3 rounded-xl flex items-center gap-2 text-red-700 text-xs font-bold animate-pulse">
                                <AlertCircle size={16} /><span>注意：尚有前期未結款項 NT$ {pastDueTotal.toLocaleString()}</span>
                            </div>
                        )}

                        <div className="space-y-3">
                            <h3 className="text-xs font-bold text-slate-400 px-1 mt-4 uppercase tracking-wider">歷史帳單紀錄</h3>
                            {allBillDates.length > 0 ? allBillDates.map(date => {
                                const selfBill = globalStats.creditBills[date] || { total: 0, unpaid: 0, items: [] };
                                const genieBill = globalStats.genieBills[date] || { total: 0, items: [] };
                                const isExpanded = expandedBill === date;
                                const isCurrent = date === currentCycleStr;
                                const isFullyPaid = selfBill.unpaid === 0;
                                
                                return (
                                    <div key={date} className={`bg-white rounded-xl shadow-sm border transition-all ${isFullyPaid && selfBill.total > 0 ? 'border-slate-100' : 'border-blue-100'} ${isCurrent ? 'ring-2 ring-blue-100 border-blue-300' : ''}`}>
                                        <div className="p-4 cursor-pointer" onClick={() => setExpandedBill(isExpanded ? null : date)}>
                                            <div className="flex justify-between items-center mb-2">
                                                <div className="flex items-center gap-3">
                                                    {selfBill.total > 0 ? (
                                                        <button onClick={(e) => { e.stopPropagation(); toggleBillPayment(date, !isFullyPaid); }} className={`w-8 h-8 rounded-full flex items-center justify-center transition-colors ${isFullyPaid ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-300 hover:bg-slate-200'}`}>
                                                            {isFullyPaid ? <CheckCircle size={18} /> : <div className="w-4 h-4 rounded-full border-2 border-slate-300"></div>}
                                                        </button>
                                                    ) : (
                                                        <div className="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300"><CreditCard size={16}/></div>
                                                    )}
                                                    <div>
                                                        <p className="font-bold text-sm text-slate-800 flex items-center gap-2">
                                                            {date} 
                                                            {isCurrent && <span className="bg-blue-600 text-white text-[9px] px-2 py-0.5 rounded-full">本期</span>}
                                                        </p>
                                                        <p className="text-[10px] text-slate-400">
                                                            {selfBill.items.length + genieBill.items.length} 筆交易
                                                        </p>
                                                    </div>
                                                </div>
                                                {isExpanded ? <ChevronUp size={16} className="text-slate-300"/> : <ChevronDown size={16} className="text-slate-300"/>}
                                            </div>
                                            
                                            <div className="flex items-center justify-end gap-4 pl-11">
                                                {selfBill.total > 0 && (
                                                    <div className="text-right">
                                                        <p className="text-[9px] text-slate-400">我需付</p>
                                                        <p className={`font-bold text-sm ${isFullyPaid ? 'text-slate-400 line-through' : 'text-slate-800'}`}>
                                                            ${selfBill.total.toLocaleString()}
                                                        </p>
                                                    </div>
                                                )}
                                                {genieBill.total > 0 && (
                                                    <div className="text-right">
                                                        <p className="text-[9px] text-purple-400">神燈付</p>
                                                        <p className="font-bold text-sm text-purple-600">${genieBill.total.toLocaleString()}</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {isExpanded && (
                                            <div className="border-t border-slate-50 bg-slate-50/50 p-3 rounded-b-xl space-y-4 animate-fade-in">
                                                {selfBill.items.length > 0 && (
                                                    <div>
                                                        <p className="text-[10px] font-bold text-slate-400 mb-2 flex items-center gap-1"><User size={10}/> 我的消費詳情</p>
                                                        <div className="space-y-1">
                                                            {selfBill.items.map(item => (
                                                                <div key={item.id} className="flex justify-between text-[11px] text-slate-600 px-2 py-1 bg-white rounded border border-slate-100">
                                                                    <div className="flex gap-2">
                                                                        <span className="text-slate-400 font-mono">{item.date.slice(5)}</span>
                                                                        <span>{item.category}</span>
                                                                    </div>
                                                                    <span className="font-medium text-slate-800">${item.amount.toLocaleString()}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                                {genieBill.items.length > 0 && (
                                                    <div>
                                                        <p className="text-[10px] font-bold text-purple-400 mb-2 flex items-center gap-1"><Sparkles size={10}/> 神燈代付詳情</p>
                                                        <div className="space-y-1">
                                                            {genieBill.items.map(item => (
                                                                <div key={item.id} className="flex justify-between text-[11px] text-purple-700 px-2 py-1 bg-purple-50 rounded border border-purple-100">
                                                                    <div className="flex gap-2">
                                                                        <span className="text-purple-400 font-mono">{item.date.slice(5)}</span>
                                                                        <span>{item.category}</span>
                                                                    </div>
                                                                    <span className="font-bold">${item.amount.toLocaleString()}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            }) : <div className="text-center py-10 text-xs text-slate-400 bg-white rounded-xl border border-dashed">尚無帳單紀錄</div>}
                        </div>
                    </div>
                );
            };

            const renderAdd = () => (
                <div className="pb-24 animate-fade-in">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">新增紀錄</h2>
                    <form onSubmit={handleAddTransaction} className="space-y-5">
                        <div className="flex gap-3">
                            <button type="button" onClick={() => setPayer('self')} className={`flex-1 py-4 rounded-xl border-2 transition-all flex items-center justify-center gap-2 ${payer === 'self' ? 'border-blue-600 bg-blue-50 text-blue-700 font-bold' : 'border-white bg-white text-slate-400'}`}><User size={20} /> 自己付</button>
                            <button type="button" onClick={() => setPayer('genie')} className={`flex-1 py-4 rounded-xl border-2 transition-all flex items-center justify-center gap-2 ${payer === 'genie' ? 'border-purple-500 bg-purple-50 text-purple-700 font-bold' : 'border-white bg-white text-slate-400'}`}><Sparkles size={20} /> 神燈付</button>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                <button type="button" className={`flex-1 py-2 rounded-md text-xs font-bold transition-all ${type === 'expense' ? 'bg-white shadow-sm text-rose-600' : 'text-slate-400'}`} onClick={() => { setType('expense'); setCategory(expenseCategories[0]); }}>支出</button>
                                <button type="button" className={`flex-1 py-2 rounded-md text-xs font-bold transition-all ${type === 'income' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-400'}`} onClick={() => { setType('income'); setCategory(incomeCategories[0]); }}>收入</button>
                            </div>
                            <div className="relative">
                                <span className="absolute left-0 top-3 text-slate-400 text-sm font-bold">NT$</span>
                                <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full bg-transparent p-2 pl-10 text-4xl font-black border-b border-slate-100 focus:outline-none focus:border-blue-400 rounded-none placeholder-slate-100" placeholder="0" required />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                                <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">交易日期</label>
                                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-transparent text-sm focus:outline-none" required />
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                                <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">選擇類別</label>
                                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-transparent text-sm focus:outline-none appearance-none">
                                    {(type === 'expense' ? expenseCategories : incomeCategories).map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                            <label className="block text-[10px] font-bold text-slate-400 mb-2 uppercase">付款方式</label>
                            <div className="grid grid-cols-4 gap-2">
                                {paymentMethods.map(method => (
                                    <button key={method} type="button" onClick={() => setPaymentMethod(method)} className={`py-2 rounded-lg text-[10px] font-bold border transition-all ${paymentMethod === method ? (payer === 'genie' ? 'bg-purple-100 text-purple-700 border-purple-300' : 'bg-blue-50 text-blue-700 border-blue-200') : 'bg-slate-50 text-slate-400 border-transparent'}`}>
                                        {method}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                            <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">名稱</label>
                            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="輸入名稱..." className="w-full bg-transparent text-sm focus:outline-none" />
                        </div>

                        <button type="submit" className={`w-full py-4 rounded-2xl font-black text-lg shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-white ${payer === 'genie' ? 'bg-purple-600' : 'bg-slate-900'}`}>
                            <Plus size={24} strokeWidth={3} /> {payer === 'genie' ? '記錄神燈支出' : '儲存紀錄'}
                        </button>
                    </form>
                </div>
            );

            const renderSearch = () => {
                const filteredTransactions = transactions.filter(t => {
                    const matchKeyword = searchKeyword ? (t.category.includes(searchKeyword) || t.note.includes(searchKeyword) || t.paymentMethod.includes(searchKeyword)) : true;
                    const matchMinAmount = searchMinAmount ? t.amount >= parseFloat(searchMinAmount) : true;
                    const matchMaxAmount = searchMaxAmount ? t.amount <= parseFloat(searchMaxAmount) : true;
                    const matchCategory = searchCategory ? t.category === searchCategory : true;
                    const matchStartDate = searchStartDate ? t.date >= searchStartDate : true;
                    const matchEndDate = searchEndDate ? t.date <= searchEndDate : true;
                    return matchKeyword && matchMinAmount && matchMaxAmount && matchCategory && matchStartDate && matchEndDate;
                });

                const isFiltering = searchKeyword || searchMinAmount || searchMaxAmount || searchCategory || searchStartDate || searchEndDate;

                return (
                    <div className="space-y-4 pb-24 animate-fade-in flex flex-col h-[calc(100vh-140px)]">
                        <div className="flex justify-between items-center px-1">
                            <h2 className="text-2xl font-bold text-slate-800">查詢紀錄</h2>
                            <button onClick={() => setShowFilters(!showFilters)} className={`p-2 rounded-lg transition-colors ${showFilters ? 'bg-blue-100 text-blue-600' : 'bg-white text-slate-400 border border-slate-100 shadow-sm'}`}><Filter size={20} /></button>
                        </div>
                        
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                            <div className="relative">
                                <Search className="absolute left-3 top-3 text-slate-400" size={18} />
                                <input type="text" placeholder="關鍵字搜尋..." value={searchKeyword} onChange={(e) => setSearchKeyword(e.target.value)} className="w-full bg-slate-50 p-2.5 pl-10 rounded-lg border border-slate-100 focus:outline-none focus:border-blue-400 text-sm text-slate-700" />
                            </div>
                            {showFilters && (
                                <div className="space-y-3 pt-3 border-t border-slate-50 animate-fade-in">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={searchStartDate} onChange={(e) => setSearchStartDate(e.target.value)} className="bg-slate-50 p-2 rounded border border-slate-100 text-[10px]" />
                                        <input type="date" value={searchEndDate} onChange={(e) => setSearchEndDate(e.target.value)} className="bg-slate-50 p-2 rounded border border-slate-100 text-[10px]" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" placeholder="最低金額" value={searchMinAmount} onChange={(e) => setSearchMinAmount(e.target.value)} className="bg-slate-50 p-2 rounded border border-slate-100 text-[10px]" />
                                        <input type="number" placeholder="最高金額" value={searchMaxAmount} onChange={(e) => setSearchMaxAmount(e.target.value)} className="bg-slate-50 p-2 rounded border border-slate-100 text-[10px]" />
                                    </div>
                                    <select value={searchCategory} onChange={(e) => setSearchCategory(e.target.value)} className="w-full bg-slate-50 p-2 rounded border border-slate-100 text-[10px]">
                                        <option value="">所有類別</option>
                                        {[...expenseCategories, ...incomeCategories].map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                            )}
                            {isFiltering && (
                                <button onClick={clearSearch} className="w-full py-2 text-xs text-blue-600 font-bold bg-blue-50 rounded-lg hover:bg-blue-100 transition flex items-center justify-center gap-1"><X size={12} /> 清除篩選條件</button>
                            )}
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-2 no-scrollbar">
                            <p className="text-[10px] text-slate-400 font-bold px-1 uppercase tracking-wider">共 {filteredTransactions.length} 筆資料</p>
                            {filteredTransactions.length > 0 ? filteredTransactions.map(t => (
                                <div onClick={() => setSelectedTransaction(t)} key={t.id} className="cursor-pointer bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center relative overflow-hidden group hover:shadow-sm transition-all active:scale-[0.99]">
                                    {t.payer === 'genie' && <div className="absolute left-0 top-0 bottom-0 w-1 bg-purple-400"></div>}
                                    <div className="flex items-center gap-3">
                                        <div className="text-[10px] font-black text-slate-300 w-8 leading-tight">{t.date.split('-')[1]}<br/>{t.date.split('-')[2]}</div>
                                        <div>
                                            <p className="font-bold text-slate-800 text-sm flex items-center gap-1">{t.note || t.category} {t.payer === 'genie' && <Sparkles size={10} className="text-purple-500"/>}</p>
                                            <p className="text-[10px] text-slate-400 truncate max-w-[120px]">{t.category} • {t.paymentMethod}</p>
                                        </div>
                                    </div>
                                    <div className="text-right flex items-center gap-4">
                                        <p className={`font-bold text-sm ${t.payer === 'genie' ? 'text-purple-600' : t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}`}>{t.type === 'income' ? '+' : ''}{t.amount.toLocaleString()}</p>
                                        <button onClick={(e) => { e.stopPropagation(); triggerDelete(t.id); }} className="p-2 text-slate-200 hover:text-rose-500 transition-colors"><X size={16} /></button>
                                    </div>
                                </div>
                            )) : (
                                <div className="text-center py-20 opacity-20"><Search size={48} className="mx-auto mb-2"/><p className="text-sm">查無結果</p></div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderSettings = () => (
                <div className="pb-24 space-y-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-slate-800">偏好設定</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
                        <div>
                            <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">每月結算日</label>
                            <div className="relative">
                                <input type="number" min="1" max="31" value={billingSettings.closingDay} onChange={(e) => setBillingSettings({...billingSettings, closingDay: parseInt(e.target.value) || 1})} className="w-full bg-slate-50 p-4 rounded-xl border border-slate-100 text-xl font-bold text-slate-800 focus:outline-none focus:border-blue-400"/>
                                <span className="absolute right-4 top-5 text-slate-300 font-bold">號</span>
                            </div>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-wide">結算頻率</label>
                            <div className="space-y-2">
                                {['monthly', 'bimonthly-even', 'bimonthly-odd'].map((type) => (
                                    <button key={type} onClick={() => setBillingSettings({...billingSettings, cycleType: type})} className={`w-full text-left p-4 rounded-xl border-2 transition-all ${billingSettings.cycleType === type ? 'border-blue-500 bg-blue-50' : 'border-slate-50 bg-white'}`}>
                                        <div className="font-bold text-sm text-slate-700">
                                            {type === 'monthly' ? '每月一次' : type === 'bimonthly-even' ? '雙月結算 (雙數月)' : '雙月結算 (單數月)'}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* 資料備份與還原區塊 */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">資料備份與還原</label>
                        <p className="text-[10px] text-slate-400 mb-4">您可以將記帳資料下載保存，或從備份檔案還原資料。</p>
                        
                        <div className="flex gap-3">
                            <button onClick={handleExport} className="flex-1 py-3 px-4 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-emerald-100 transition-colors">
                                <Download size={18} /> 匯出備份
                            </button>
                            <button onClick={handleImportClick} className="flex-1 py-3 px-4 bg-blue-50 text-blue-600 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors">
                                <Upload size={18} /> 還原資料
                            </button>
                            <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleFileChange} 
                                accept=".json" 
                                className="hidden" 
                            />
                        </div>
                    </div>

                    <button onClick={triggerReset} className="w-full py-3 text-rose-500 font-bold text-xs bg-rose-50 rounded-xl hover:bg-rose-100 transition-colors">重設所有資料</button>
                </div>
            );

            return (
                <div className="bg-slate-50 min-h-screen font-sans text-slate-900 flex justify-center selection:bg-blue-100">
                    <div className="w-full max-w-md bg-slate-50 min-h-screen relative shadow-2xl overflow-x-hidden">
                        <header className="px-6 py-5 flex justify-between items-center bg-white sticky top-0 z-40 border-b border-slate-50/80 backdrop-blur-md">
                            <h1 className="text-xl font-black tracking-tighter flex items-center gap-2">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><Landmark size={18} /></div>
                                效率記帳本
                            </h1>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setActiveTab('settings')} className={`p-2 rounded-full transition-colors ${activeTab === 'settings' ? 'bg-slate-100 text-slate-800' : 'text-slate-300'}`}><Settings size={20} /></button>
                            </div>
                        </header>

                        <main className="p-5">
                            {activeTab === 'home' && renderHome()}
                            {activeTab === 'stats' && renderStats()}
                            {activeTab === 'cards' && renderCards()}
                            {activeTab === 'search' && renderSearch()}
                            {activeTab === 'add' && renderAdd()}
                            {activeTab === 'settings' && renderSettings()}
                            {activeTab === 'subscriptions' && renderSubscriptions()} 
                        </main>

                        <nav className="fixed bottom-0 w-full max-w-md bg-white/90 backdrop-blur-lg border-t border-slate-100 px-6 py-3 flex justify-between items-center z-50 pb-safe shadow-[0_-5px_20px_rgba(0,0,0,0.02)]">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'home' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}><Home size={22} strokeWidth={activeTab === 'home' ? 3 : 2} /><span className="text-[9px] font-bold">總覽</span></button>
                            <button onClick={() => setActiveTab('cards')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'cards' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}><CreditCard size={22} strokeWidth={activeTab === 'cards' ? 3 : 2} /><span className="text-[9px] font-bold">帳單</span></button>
                            <div className="relative -top-6">
                                <button onClick={() => setActiveTab('add')} className={`p-4 rounded-2xl shadow-xl transition-all border-4 border-slate-50 ${activeTab === 'add' ? 'bg-rose-500 text-white rotate-45' : 'bg-slate-900 text-white'}`}>
                                    <Plus size={28} strokeWidth={3} />
                                </button>
                            </div>
                            <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'stats' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}><PieChart size={22} strokeWidth={activeTab === 'stats' ? 3 : 2} /><span className="text-[9px] font-bold">統計</span></button>
                            <button onClick={() => setActiveTab('search')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'search' || activeTab === 'subscriptions' ? 'text-blue-600 scale-110' : 'text-slate-300'}`}><Search size={22} strokeWidth={activeTab === 'search' ? 3 : 2} /><span className="text-[9px] font-bold">查詢</span></button>
                        </nav>
                        
                        <TransactionDetailModal 
                            transaction={selectedTransaction} 
                            onClose={() => setSelectedTransaction(null)} 
                            onDelete={triggerDelete}
                        />

                        <ConfirmModal 
                            isOpen={confirmState.isOpen} 
                            title={confirmState.title} 
                            message={confirmState.message}
                            confirmText={confirmState.confirmText}
                            confirmColor={confirmState.confirmColor}
                            onConfirm={handleConfirmAction} 
                            onCancel={() => setConfirmState({ ...confirmState, isOpen: false, type: null, data: null })} 
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
